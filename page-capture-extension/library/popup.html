<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMT Itinerary ID Capture</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe4;
        --panel: #fffaf2;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --border: #e7dcc7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 360px;
        min-height: 240px;
        padding: 16px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at top right, #fde68a 0, transparent 36%),
          linear-gradient(180deg, var(--bg) 0%, #f8f5ef 100%);
        color: var(--text);
      }

      .card {
        background: rgba(255, 250, 242, 0.94);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 12px 28px rgba(31, 41, 55, 0.08);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 18px;
      }

      .subtitle {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .label {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .value {
        margin: 0;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }

      .empty {
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      button,
      a {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 10px 14px;
        font: inherit;
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease;
      }

      button:hover,
      a:hover {
        transform: translateY(-1px);
      }

      #copyButton {
        background: var(--accent);
        color: #fff;
      }

      #copyButton:disabled {
        background: #9ca3af;
        cursor: not-allowed;
        transform: none;
      }

      #openPageLink {
        background: #efe7d6;
        color: var(--text);
      }

      .meta {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Saved Itinerary</h1>
      <p class="subtitle">
        The latest itinerary ID captured from the MakeMyTrip DIY Planner will
        appear here.
      </p>

      <p class="label">Itinerary ID</p>
      <p id="itineraryId" class="value empty">No itinerary captured yet.</p>

      <div class="actions">
        <button id="copyButton" type="button" disabled>Copy ID</button>
        <a
          id="openPageLink"
          href="#"
          target="_blank"
          rel="noreferrer"
          aria-disabled="true"
        >Open source page</a>
      </div>

      <div class="meta">
        <div id="capturedAt">Captured: -</div>
        <div id="backendStatus">Backend: -</div>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
